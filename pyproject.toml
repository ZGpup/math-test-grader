[project]
name = "math-test-grader"
version = "0.1.0"
description = "Local, offline grader for scanned paper math tests"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "matplotlib>=3.8",
]

[project.scripts]
grader = "app.main:run"

[dependency-groups]
dev = [
    "httpx2>=2",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Third-party deprecations outside this project's control.
    "ignore:builtin type Swig:DeprecationWarning",
    "ignore:builtin type swigvarlink:DeprecationWarning",
    "ignore:The anyio.abc.BlockingPortal alias:DeprecationWarning",
]
